# Known findings: the only place a failing result becomes "known" (report/triage.py).
#
# This copy holds the entries for the rocAL vision-pack QA workflow: the rocal
# suite and the rocAL checks of robustness and robustness-nogpu. Entries that
# also cover other libraries keep only the globs for these result IDs; the IDs
# are the same in every library's copy.
#
# Seeded from the manual QA report of 25 Sep 2026 (C1-C2 critical, H1-H19 high,
# M1-M23 medium, low items L-*) and the provisional findings N1-N4; N5 onwards
# were found while porting the suites (27 Sep 2026).
#
# Each entry:
#   id, title, severity (critical|high|medium|low), owner
#   kind:   xfail (expected to fail; a pass is reported as "fixed"),
#           flaky, skip (expected to be blocked/skipped), quarantine (ignored)
#   match:  shell-style globs over result IDs <suite>::<group>::<name>. Match
#           only the failing tests: a glob that also covers passing tests turns
#           them into "fixed" every night. "[" must be written "[[]".
#   match_file: a list under lists/ (relative to this file), one result ID or
#           glob per line, for findings that cover many parameterised results
#   gfx:    optional globs over the tested GPU (default: every GPU, and nights
#           without one); [none] scopes an entry to nights on a runner without
#           a usable GPU, when only the needs_gpu: false suites run
#   tiers:  optional; issue: upstream URL; added / review_by: YYYY-MM-DD
#   strict: report the entry in the verdict reasons once all its tests pass
# Once review_by has passed, re-verify the finding and extend review_by (with an
# upstream issue link), or remove the entry.
schema: 1
issues:
  # ------------------------------------------------------------------ critical
  - id: C2
    title: Bundled LMDB 1.0.1 cannot open standard LMDB 0.9 databases; rocAL Caffe/Caffe2 readers fail
    severity: critical
    owner: vision-pack
    kind: xfail
    match:
      - "rocal::lmdb::bundled-open.*"
      - "rocal::readers.*::caffe*-lmdb*"
    # Golden cases read through the Caffe/Caffe2 readers, attributed by their
    # abort message (most IDs are plain augmentation names).
    match_file: lists/C2-rocal-golden.txt
    issue: https://github.com/kiritigowda/vision-pack/issues/58
    added: 2026-09-25
    review_by: 2026-12-31
    strict: true

