# Suites of the rocAL vision-pack QA workflow: the rocal suite, plus
# robustness and robustness-nogpu cut down to their rocAL checks. The entries
# keep the values of the full vision-pack QA matrix.
#
#   runner:  where plan_matrix.py places the suite (hosted, gpu or cpu). Here
#            the gpu job runs rocal and robustness, and the cpu job runs
#            robustness-nogpu in a container without GPU devices.
#   tiers:   the tiers that include the suite. Inside a suite, run.sh scales the
#            work further with vp_tier_ge (quick < standard < comprehensive < full).
#   image:   test: the dependency set install_deps.sh provides (Python 3.12,
#            OpenCV, numpy, Pillow, matplotlib, CPU torch, cmake, ninja, jq).
#   entrypoint: script that runs the suite (default suites/<name>/run.sh).
#   gpu_access: chosen (default: the GPU assigned to the job),
#               all    (also GPUs the build does not target, for the
#                       unsupported-GPU negatives), or
#               none   (no GPU device at all: CPU paths must still work).
#   needs_gpu:  true (default) or false. On a run without a usable GPU,
#               merge.py reports a missing suite that needs one as
#               <suite>::infra::no-gpu instead of <suite>::infra::no-results.
#
# Timeouts are about three times the comprehensive wall time measured on
# 27 Sep 2026 (nightly-20260926, RX 9070 XT), with room for the full tier's
# extras and the downloads. A timeout is an infrastructure error, so keep them
# tight enough to catch hangs.

suites:
  rocal:
    runner: gpu
    tiers: [quick, standard, comprehensive, full]
    timeout_minutes: 60  # measured 19.5 min (C++ golden sweep 11 min)
    image: test
    description: ctest, C++ and Python golden sweeps, audio, readers, API probes

  # robustness and robustness-nogpu hold only the rocAL checks here; the
  # timeouts and descriptions are those of the full suites.
  robustness:
    runner: gpu
    tiers: [comprehensive, full]
    timeout_minutes: 15  # measured 66 s, of which 60 s is the M12 hang guard
    image: test
    gpu_access: all
    description: unsupported-GPU negatives, exit-code honesty, hang guards

  robustness-nogpu:
    runner: gpu
    tiers: [comprehensive, full]
    timeout_minutes: 10  # measured 3 s
    image: test
    gpu_access: none
    needs_gpu: false
    entrypoint: suites/robustness/nogpu.sh
    description: CPU pipelines in a container with no GPU device
